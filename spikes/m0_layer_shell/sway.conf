# Minimal headless sway for the M0 spike.
# A saturated background colour is deliberate: it is the "wallpaper" the widget
# has to be transparent against, and a colour makes the proof arithmetic rather
# than visual — a screenshot pixel either carries some of it or it does not.
output HEADLESS-1 mode 1280x720
output HEADLESS-1 background #1E6FD9 solid_color
default_border none
focus_follows_mouse no
