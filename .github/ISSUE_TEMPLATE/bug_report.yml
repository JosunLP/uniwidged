name: Bug report
description: Something does not work the way the documentation says it does.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: version
    attributes:
      label: uniwidged --version
      render: text
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: uniwidged doctor
      description: What this session can and cannot do.
      render: text
  - type: textarea
    id: log
    attributes:
      label: uniwidged log
      description: The relevant part of what the desktop said.
      render: text
