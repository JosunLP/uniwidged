name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    name: fmt · clippy · test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-wasip2
      - uses: Swatinem/rust-cache@v2
      # The platform tests start their own nested server — Xvfb for X11, a
      # headless sway for Wayland — so this needs no session and no display,
      # only the binaries.
      # `x11-xserver-utils` is `xrandr`: the two-monitor tests declare virtual
      # RandR monitors over the nested server's screen, and the hotplug test
      # turns its one output off and on again.
      - run: sudo apt-get update && sudo apt-get install -y xvfb sway x11-xserver-utils
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets
      # The documentation is most of this codebase, and a doc link that no
      # longer resolves is a reader sent nowhere. `-D warnings` is already set
      # above, so a broken intra-doc link fails here rather than rotting.
      - run: cargo doc --workspace --no-deps
        env:
          # `RUSTFLAGS` above reaches rustc and not rustdoc, so a broken link
          # would have been a warning nobody read. This is the flag that makes
          # the sentence above true.
          RUSTDOCFLAGS: -D warnings
      # No GPU on this runner, so the rendering tests skip here by design and
      # are covered by the `snapshots` job below.
      - run: cargo test --workspace
        env:
          # Without these the platform tests skip themselves where the server
          # is missing, and a green run would prove nothing about dragging or
          # about the layer shell.
          UNIWIDGED_REQUIRE_X11: "1"
          UNIWIDGED_REQUIRE_WAYLAND: "1"
          # The HTTPS tests make their own certificate with `openssl` and talk
          # to a server they started. Without this they would skip on a runner
          # missing it, and the redirect rules are the last place to accept a
          # green run that proved nothing.
          UNIWIDGED_REQUIRE_NET: "1"

  # Every visual claim in ARCHITECTURE.md §7 is pinned by a golden image, and
  # golden images are only evidence if they run on every change. lavapipe is a
  # software Vulkan device and is deterministic, so this needs no GPU and no
  # display.
  #
  # It is also the only job with a device, which makes it the only one where
  # `crates/uniwidged-cli/tests/live.rs` runs: that suite starts the real
  # binary on a real X server and needs a swapchain to put a widget on. It
  # skips itself in the job above, where there is no adapter — and
  # `UNIWIDGED_REQUIRE_GPU` below is what stops it skipping silently here.
  snapshots:
    name: golden images (lavapipe), and a live desktop
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip2
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y mesa-vulkan-drivers xvfb sway x11-xserver-utils
      - run: cargo test --workspace
        env:
          WGPU_BACKEND: vulkan
          VK_ICD_FILENAMES: /usr/share/vulkan/icd.d/lvp_icd.json
          # Without this the GPU tests skip themselves where no adapter is
          # found, and a green run would prove nothing. Set here so that a
          # broken driver in CI fails loudly instead of quietly covering
          # nothing.
          UNIWIDGED_REQUIRE_GPU: "1"
          UNIWIDGED_REQUIRE_X11: "1"
          UNIWIDGED_REQUIRE_WAYLAND: "1"
          # The HTTPS tests make their own certificate with `openssl` and talk
          # to a server they started. Without this they would skip on a runner
          # missing it, and the redirect rules are the last place to accept a
          # green run that proved nothing.
          UNIWIDGED_REQUIRE_NET: "1"

  supply-chain:
    name: cargo deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2

  # Each widget in `widgets/` is its own workspace — it is built for
  # `wasm32-wasip2`, and a member of the host's workspace would be built for
  # the host's target by `cargo test`. That isolation means `cargo test
  # --workspace` never runs their own unit tests, so they are run here. They
  # are the worked examples a new author copies, and an example whose own tests
  # do not run is one that rots without anybody noticing.
  reference-widgets:
    name: the widgets' own tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-wasip2
      - uses: Swatinem/rust-cache@v2
      - name: cargo test, fmt and clippy in every widget
        run: |
          set -eu
          for widget in widgets/*/; do
            [ -f "$widget/Cargo.toml" ] || continue
            echo "::group::$widget"
            # Natively: `export!` expands to a type check off `wasm32`, so a
            # widget's own logic is testable with no WASM toolchain — which is
            # the property the SDK promises its users and is checked here.
            (cd "$widget" && cargo fmt --check && cargo clippy --all-targets && cargo test)
            # And for the target it actually ships to.
            (cd "$widget" && cargo build --release --target wasm32-wasip2)
            echo "::endgroup::"
          done

  # The sandbox is only a sandbox if what it refuses is tested. This builds the
  # conformance widget as a real `wasm32-wasip2` component, instantiates it
  # under a deny-all policy, and asserts that every capability attempt fails.
  sandbox:
    name: capability conformance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          # The suite builds the widget itself rather than looking for a
          # prebuilt file — a conformance suite that skips when an artefact is
          # missing eventually always skips.
          targets: wasm32-wasip2
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p uniwidged-runtime

  # A packaging script is only a packaging script if it runs. This builds the
  # `.deb` and then looks inside it — a package that builds and is missing its
  # binary is a build that succeeded and a user who cannot start the program.
  #
  # It is deliberately not an installation test: installing as root and
  # starting a session under it is a virtual machine, and a job that pretended
  # otherwise would be a green tick meaning nothing. See packaging/README.md.
  package:
    name: the .deb, and what is inside it
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # `dpkg-shlibdeps` is in dpkg-dev, and it is what asks the binary which
      # libraries it needs. `groff` renders the manual page below. Installed
      # rather than assumed: the script refuses to write a `Depends` it could
      # not derive, so a runner without the tool would fail here anyway, and
      # failing with a missing package is a worse message than not failing.
      - run: sudo apt-get update && sudo apt-get install -y dpkg-dev groff
      - run: packaging/deb/build.sh --output "$RUNNER_TEMP/deb"
      - name: the package holds what it promises
        run: |
          set -eu
          package=$(ls "$RUNNER_TEMP"/deb/uniwidged_*.deb)
          echo "::group::contents"
          dpkg-deb --contents "$package"
          dpkg-deb --info "$package"
          echo "::endgroup::"
          contents=$(dpkg-deb --contents "$package")
          for path in ./usr/bin/uniwidged ./usr/share/man/man1/uniwidged.1.gz \
                      ./usr/share/applications/uniwidged.desktop; do
            echo "$contents" | grep -q " $path\$" || {
              echo "the package is missing $path" >&2
              exit 1
            }
          done
          # The version in the package is the version in the workspace: two
          # places to write one is one place to forget it.
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -1)
          dpkg-deb --field "$package" Version | grep -qx "$version" || {
            echo "the package says $(dpkg-deb --field "$package" Version), the workspace says $version" >&2
            exit 1
          }
          # The dependencies were asked of the binary rather than written by
          # hand, so the one this program cannot start without is the one worth
          # asserting: the X11 surface is created through libxcb.
          dpkg-deb --field "$package" Depends | grep -q libxcb || {
            echo "the package does not depend on libxcb: $(dpkg-deb --field "$package" Depends)" >&2
            exit 1
          }
          # And the binary in it runs and knows its own version.
          mkdir -p "$RUNNER_TEMP/unpacked"
          dpkg-deb --extract "$package" "$RUNNER_TEMP/unpacked"
          "$RUNNER_TEMP/unpacked/usr/bin/uniwidged" --version | grep -q "uniwidged $version"
      # `-ww` turns a mis-nested macro into a failure. A manual page nobody
      # rendered before shipping is one that renders as nonsense.
      - name: the manual page has no roff warnings
        run: groff -man -ww -z packaging/uniwidged.1
