# A release is a tag.
#
# Pushing `v<version>` builds the `.deb` the way `ci.yml` builds it, the
# Windows installer and the macOS bundle the way their CI jobs do, checks that
# the tag agrees with the workspace about the version — two places to write one
# is one place to forget it — and attaches all three and their checksums to a
# GitHub release. With a crates.io token it also publishes the SDK.
#
# Signing is the one thing that needs secrets, and every one is optional: a
# release without them is built and published *unsigned*, and its notes say so.
#
#   WINDOWS_CERTIFICATE, WINDOWS_CERTIFICATE_PASSWORD  base64 .pfx, for signtool
#   MACOS_CERTIFICATE, MACOS_CERTIFICATE_PASSWORD      base64 .p12 (Developer ID)
#   MACOS_SIGNING_IDENTITY                             "Developer ID Application: …"
#   APPLE_ID, APPLE_TEAM_ID, APPLE_APP_PASSWORD        for notarytool
#   CARGO_REGISTRY_TOKEN                               for the SDK on crates.io The tests are not run again here: the commit
# a tag points at has already been through `ci.yml` on `main`, and a release
# workflow that re-ran them would be a second, slower copy of the first.
#
# It is deliberately nothing else. No changelog is generated — `CHANGELOG.md`
# is written by hand, and the release notes point at it — and no version is
# bumped by a robot.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  msi:
    name: the Windows installer
    runs-on: windows-latest
    # Job-level, because a step's own `env` is not visible to its `if`.
    env:
      CERT: ${{ secrets.WINDOWS_CERTIFICATE }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: dotnet tool install --global wix --version 5.0.2
      - name: the certificate, if there is one
        if: ${{ env.CERT != '' }}
        shell: pwsh
        run: |
          $path = Join-Path $env:RUNNER_TEMP "sign.pfx"
          [IO.File]::WriteAllBytes($path, [Convert]::FromBase64String($env:CERT))
          "UNIWIDGED_SIGN_CERT=$path" | Out-File -FilePath $env:GITHUB_ENV -Append
      - name: the installer
        shell: pwsh
        env:
          UNIWIDGED_SIGN_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: packaging\windows\build.ps1 -Output "$env:RUNNER_TEMP\dist"
      - uses: actions/upload-artifact@v4
        with:
          name: msi
          path: ${{ runner.temp }}/dist/*.msi

  app:
    name: the macOS bundle
    runs-on: macos-latest
    env:
      CERT: ${{ secrets.MACOS_CERTIFICATE }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - name: the certificate and the notary, if there are any
        if: ${{ env.CERT != '' }}
        env:
          CERT_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          set -eu
          keychain="$RUNNER_TEMP/signing.keychain-db"
          password=$(openssl rand -hex 16)
          echo "$CERT" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security import "$RUNNER_TEMP/cert.p12" -P "$CERT_PASSWORD" -A -t cert -f pkcs12 -k "$keychain"
          security set-key-partition-list -S apple-tool:,apple: -k "$password" "$keychain"
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          echo "MACOS_SIGNING_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"
          if [ -n "$APPLE_ID" ]; then
            xcrun notarytool store-credentials uniwidged --apple-id "$APPLE_ID" \
              --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD"
            echo "MACOS_NOTARY_PROFILE=uniwidged" >> "$GITHUB_ENV"
          fi
      - run: packaging/macos/build.sh --universal --output "$RUNNER_TEMP/dist"
      - uses: actions/upload-artifact@v4
        with:
          name: app
          path: ${{ runner.temp }}/dist/*.zip

  # The SDK, so that a widget can depend on `uniwidged-guest = "1"` rather than
  # on a git tag. One `cargo publish` for the three crates, which publishes them
  # in dependency order and verifies each against the others first.
  #
  # Red without a token rather than skipped: a released `uniwidged new` writes
  # a project that asks crates.io for this version, and a release whose SDK is
  # not there is one whose first scaffold does not build.
  sdk:
    name: the SDK on crates.io
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip2
      - name: publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          set -eu
          if [ -z "$CARGO_REGISTRY_TOKEN" ]; then
            echo "::error::no CARGO_REGISTRY_TOKEN, so the SDK was not published and this release's \`uniwidged new\` will not build"
            exit 1
          fi
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -1)
          on_crates_io() {
            curl -sSf -o /dev/null -A "uniwidged release workflow" \
              "https://crates.io/api/v1/crates/$1/$version"
          }
          # One crate at a time, in dependency order, skipping any a retried
          # release already published: crates.io refuses a version twice, and
          # a re-run must be able to finish what the first run started.
          for crate in uniwidged-core uniwidged-view uniwidged-guest; do
            if on_crates_io "$crate"; then
              echo "$crate $version is already on crates.io"
            else
              cargo publish --locked --target wasm32-wasip2 -p "$crate"
            fi
          done
          # What the release below is gated on: every SDK crate a released
          # `uniwidged new` will ask for, answerable from crates.io itself.
          for crate in uniwidged-core uniwidged-view uniwidged-guest; do
            on_crates_io "$crate" || { echo "::error::$crate $version is not on crates.io"; exit 1; }
          done

  deb:
    name: the .deb, and the release
    # The SDK too: a release whose `uniwidged new` scaffolds against crates
    # that are not on crates.io is one whose first widget does not build.
    needs: [msi, app, sdk]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y dpkg-dev groff pkg-config libfontconfig1-dev libxcb1-dev
      - name: the tag is the version
        run: |
          set -eu
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -1)
          tag=${GITHUB_REF_NAME#v}
          [ "$tag" = "$version" ] || {
            echo "the tag says $tag and Cargo.toml says $version" >&2
            exit 1
          }
          # Literally: a version is not a pattern, and `1.0.0` must not match `1x0x0`.
          # After it, the end of the line, a space or a tab; `1.0.0` is not `1.0.01`.
          awk -v h="## $version" '
            index($0, h) == 1 && substr($0, length(h) + 1, 1) ~ /^([ \t]|)$/ { found = 1 }
            END { exit !found }
          ' CHANGELOG.md || {
            echo "CHANGELOG.md has no entry for $version" >&2
            exit 1
          }
      - run: packaging/deb/build.sh --output "$RUNNER_TEMP/deb"
      - name: the package holds what it promises
        run: |
          set -eu
          package=$(ls "$RUNNER_TEMP"/deb/uniwidged_*.deb)
          contents=$(dpkg-deb --contents "$package")
          for path in ./usr/bin/uniwidged ./usr/share/man/man1/uniwidged.1.gz \
                      ./usr/share/applications/uniwidged.desktop \
                      ./usr/share/bash-completion/completions/uniwidged; do
            echo "$contents" | grep -q " $path\$" || { echo "missing $path" >&2; exit 1; }
          done
          mkdir -p "$RUNNER_TEMP/unpacked"
          dpkg-deb --extract "$package" "$RUNNER_TEMP/unpacked"
          "$RUNNER_TEMP/unpacked/usr/bin/uniwidged" --version
      - uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/deb
          merge-multiple: true
      - name: checksums
        run: cd "$RUNNER_TEMP/deb" && sha256sum uniwidged_*.deb uniwidged-*.msi uniwidged-*-macos.zip > SHA256SUMS
      - name: the release notes are this version's changelog section
        env:
          WINDOWS_SIGNED: ${{ secrets.WINDOWS_CERTIFICATE != '' && '1' || '' }}
          MACOS_SIGNED: ${{ secrets.APPLE_ID != '' && secrets.MACOS_CERTIFICATE != '' && '1' || '' }}
        run: |
          set -eu
          version=${GITHUB_REF_NAME#v}
          # The section runs to the next level-two heading. Fences are tracked
          # from the top of the file, so a `## ` inside an example neither starts
          # nor ends the section; as in CommonMark, a fence closes only with the
          # character that opened it, at least as many times, and a heading or
          # fence may be indented by up to three spaces.
          awk -v v="$version" '
            {
              line = $0; sub(/^ */, "", line); indent = length($0) - length(line)
              if (indent <= 3 && match(line, /^(````*|~~~~*)/)) {
                run = substr(line, 1, RLENGTH); rest = substr(line, RLENGTH + 1)
                # The info string of a backtick fence has no backtick: ```foo``` is
                # inline code, not an opening fence.
                if (fence == "" && (substr(run, 1, 1) != "`" || index(rest, "`") == 0)) {
                  fence = run; if (on) print; next
                }
                if (substr(run, 1, 1) == substr(fence, 1, 1) &&
                    length(run) >= length(fence) && rest ~ /^[ \t]*$/) {
                  fence = ""; if (on) print; next
                }
              }
              if (fence == "" && indent <= 3) {
                h = "## " v
                if (!on && index(line, h) == 1 && substr(line, length(h) + 1, 1) ~ /^([ \t]|)$/) {
                  on = 1; seen = 1; next
                }
                if (on && line ~ /^## /) exit
              }
              if (on) print
            }
            END { exit !seen }
          ' CHANGELOG.md > "$RUNNER_TEMP/notes.md" || {
            # Only a heading inside a fenced example matched the check above.
            echo "CHANGELOG.md has no section for $version outside an example" >&2
            exit 1
          }
          # A heading with nothing under it is no release notes at all.
          grep -q '[^[:space:]]' "$RUNNER_TEMP/notes.md" || {
            echo "CHANGELOG.md has an empty section for $version" >&2
            exit 1
          }
          {
            echo
            echo "---"
            echo "The \`.deb\`, the \`.msi\` and the macOS \`.zip\` are built by the scripts in \`packaging/\`"
            echo "and checked the way CI checks them; \`SHA256SUMS\` holds their checksums."
            if [ -z "$WINDOWS_SIGNED" ]; then echo "The Windows installer is **unsigned**: SmartScreen will warn before running it."; fi
            if [ -z "$MACOS_SIGNED" ]; then echo "The macOS bundle is **not notarised**: Gatekeeper refuses it from a download until \`xattr -d com.apple.quarantine uniwidged.app\`."; fi
            echo "Documentation: https://josunlp.github.io/uniwidged/"
          } >> "$RUNNER_TEMP/notes.md"
      - name: the release
        uses: softprops/action-gh-release@v2
        with:
          name: uniwidged ${{ github.ref_name }}
          body_path: ${{ runner.temp }}/notes.md
          files: |
            ${{ runner.temp }}/deb/uniwidged_*.deb
            ${{ runner.temp }}/deb/uniwidged-*.msi
            ${{ runner.temp }}/deb/uniwidged-*-macos.zip
            ${{ runner.temp }}/deb/SHA256SUMS
