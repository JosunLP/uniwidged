[workspace]
resolver = "3"
members = [
    "crates/uniwidged-core",
    "crates/uniwidged-view",
    "crates/uniwidged-compose",
    "crates/uniwidged-render",
    "crates/uniwidged-shell",
    "crates/uniwidged-runtime",
    "crates/uniwidged-guest",
    "crates/uniwidged-host",
    "crates/uniwidged-cli",
    "examples/hello_widget",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
# 1.95 because the Wasmtime 48.x releases that fix its 2026 security advisories
# (see `cargo deny`) need it, and this process runs other people's code.
rust-version = "1.95"
license = "MIT OR Apache-2.0"
repository = "https://github.com/j-pfalzgraf/uniwidged"
authors = ["uniwidged contributors"]

[workspace.dependencies]
# --- Linebender / rendering stack ----------------------------------------
# One pin per crate, shared by the whole workspace. `uniwidged-compose` builds a
# `vello::Scene` that `uniwidged-render` submits, so the two have to agree on
# the version or the types stop unifying — which is what a single workspace
# entry guarantees.
vello = "0.9.0"
parley = "0.10.0"
pollster = "0.4.0"
png = "0.18.1"
kurbo = "0.13.1"
peniko = "0.6.1"
taffy = "0.11.0"

# There is deliberately no `wgpu` entry. Vello re-exports the exact wgpu it was
# built against (`vello::wgpu`, currently 29.x), and reaching it that way makes
# a version mismatch impossible. Pinning wgpu separately is how a project ends
# up with two `Device` types and an error message nobody enjoys reading.

# --- Accessibility --------------------------------------------------------
accesskit = "0.24.1"

# --- Platform surfaces ----------------------------------------------------
# `uniwidged-shell` creates desktop-layer surfaces itself and hands wgpu a raw
# handle. There is no winit anywhere in this workspace on purpose: winit has no
# `wlr-layer-shell` role and no way to ask for one, and that role is the whole
# definition of a desktop widget.
raw-window-handle = "0.6.2"

# X11, through libxcb rather than through x11rb's pure-Rust connection: wgpu
# needs a real `xcb_connection_t*` to create a surface, and a Rust connection
# has no pointer to give it. `allow-unsafe-code` is what gates that module.
# `randr` is what makes a placement survive a monitor being unplugged: it
# reports outputs by *name*, and a name is the only identifier that does not
# renumber when the hardware changes.
x11rb = { version = "0.14", features = ["allow-unsafe-code", "randr"] }

# --- WASM guests ----------------------------------------------------------
wasmtime = { version = "48.0.8", default-features = false, features = [
    "component-model",
    "cranelift",
    "runtime",
] }
wasmtime-wasi = "48.0.8"
wit-bindgen = "0.61.1"

# --- HTTPS ----------------------------------------------------------------
# What the `net` capability is served with. `rustls` rather than the system
# OpenSSL, because this process runs other people's code and a memory-safe TLS
# stack is worth more here than a smaller binary. `default-features = false`
# drops the cookie jar and the JSON support: a widget sends no cookies (it has
# no session to have one) and parses its own bodies.
#
# Twenty-six crates, all `Apache-2.0`, `MIT` or `ISC` — `cargo deny` passes
# without an exception, which was the condition for taking the dependency at
# all. See NOTICE.md.
ureq = { version = "3", default-features = false, features = ["rustls"] }

# --- Signing --------------------------------------------------------------
# Verifying that a widget came from somebody the user decided to trust. Ed25519
# because the keys and signatures are short enough to paste into a README, and
# `ed25519-dalek` because it is pure Rust — a signature check is the one thing
# that runs *before* the sandbox does, so it is the last place to want a C
# parser. `getrandom` rather than a `rand` version dance: key generation needs
# thirty-two bytes of entropy and nothing else.
ed25519-dalek = { version = "2", default-features = false, features = ["std", "fast"] }
sha2 = "0.10"
getrandom = "0.3"

# --- The keychain ---------------------------------------------------------
# What the `secrets` capability is served with where no platform keychain is
# reachable. XChaCha20-Poly1305 rather than AES-GCM for one reason that
# matters here: a 24-byte nonce may be drawn at random with no counter and no
# bookkeeping, and nonce reuse is the way a file-backed store gets this wrong.
# An AEAD rather than a cipher, so a store somebody edited fails to open
# instead of decrypting to something a widget then believes.
#
# `default-features = false` with `alloc` drops the heapless and stream
# machinery; `getrandom` is already in the graph and generates the store's key.
chacha20poly1305 = { version = "0.10", default-features = false, features = ["alloc"] }

# --- Utilities ------------------------------------------------------------
# `localtime_r`, for the one thing no std API exposes: this machine's offset
# from UTC, daylight saving included. Unix only, and already in the graph
# through Wasmtime, so it costs nothing to compile.
libc = "0.2"
serde = { version = "1", features = ["derive"] }
toml = "0.9"

# There are deliberately no path dependencies on a sibling checkout. Everything
# outside this workspace comes from crates.io, so `git clone && cargo test`
# works with nothing else on the machine — see NOTICE.md for what was adopted
# from elsewhere and how.

# --- Internal crates ------------------------------------------------------
uniwidged-core = { path = "crates/uniwidged-core", version = "0.1.0" }
uniwidged-view = { path = "crates/uniwidged-view", version = "0.1.0" }
uniwidged-compose = { path = "crates/uniwidged-compose", version = "0.1.0" }
uniwidged-render = { path = "crates/uniwidged-render", version = "0.1.0" }
uniwidged-shell = { path = "crates/uniwidged-shell", version = "0.1.0" }
uniwidged-runtime = { path = "crates/uniwidged-runtime", version = "0.1.0" }
uniwidged-guest = { path = "crates/uniwidged-guest", version = "0.1.0" }
uniwidged-host = { path = "crates/uniwidged-host", version = "0.1.0" }

# The host is an always-on desktop process. Size and steady-state cost matter
# more than throughput, but not at the price of the render path — hence `s`
# rather than Ephemeris's `z`, and no `panic = "abort"`: a widget that panics
# must not take the desktop with it.
[profile.release]
opt-level = "s"
lto = "fat"
codegen-units = 1
strip = true
