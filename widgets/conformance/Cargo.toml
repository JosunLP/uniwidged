[package]
name = "conformance-widget"
version = "0.0.1"
edition = "2024"
rust-version = "1.90"
license = "MIT OR Apache-2.0"
publish = false
description = "A widget that tries everything, so the sandbox can be tested for what it refuses."

# Its own workspace: this is built for `wasm32-wasip2`, and pulling it into the
# main one would make `cargo build --workspace` cross-compile it.
[workspace]

[lib]
crate-type = ["cdylib"]

[dependencies]
uniwidged-guest = { path = "../../crates/uniwidged-guest" }
uniwidged-core = { path = "../../crates/uniwidged-core" }
uniwidged-view = { path = "../../crates/uniwidged-view" }

[profile.release]
opt-level = "s"
lto = true
strip = true
