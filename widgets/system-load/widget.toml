# The reference widget for `metrics`. It asks for a schedule and a counter and
# nothing else — no network, no storage, no keychain — which is what a
# system monitor should need and rather less than most of them take.
name = "system-load"
version = "1.0.0"
description = "How busy this machine's processors, memory and disk are"
capabilities = ["timer", "metrics"]
memory-mb = 8

# What the user can change. Declared rather than parsed by the widget: the host
# checks the type and the range before this widget is ever started, so the code
# below has no branch for somebody typing `banana` — it cannot be given one.
#
# The number this widget cannot pick for its user. On a laptop 60 % is
# something to notice; on a build machine it is Tuesday.
[[setting]]
key = "warn-at"
label = "Warn above"
type = "number"
default = 0.6
min = 0.0
max = 1.0

[[setting]]
key = "critical-at"
label = "Critical above"
type = "number"
default = 0.85
min = 0.0
max = 1.0
