[package]
name = "uniwidged-runtime"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
authors.workspace = true
description = "The WASM sandbox uniwidged widgets run in: capabilities, limits, lifecycle."

[dependencies]
uniwidged-core.workspace = true
uniwidged-view.workspace = true
serde = { workspace = true }
toml.workspace = true
# The `net` capability's transport. See the workspace manifest on why rustls.
ureq.workspace = true
# Checking who signed a widget, before it is ever instantiated.
ed25519-dalek.workspace = true
sha2.workspace = true
getrandom.workspace = true
chacha20poly1305.workspace = true
# `register-image` decodes a widget's PNG on the host, once, so the pixels
# never cross the boundary again. Already in the graph through the renderer's
# readback, so it costs nothing to compile here.
png.workspace = true
# Optional so that the capability, manifest and lifecycle logic — which is most
# of this crate and all of its security boundary — stays testable without a
# multi-minute Wasmtime compile. On by default since M3.
wasmtime = { workspace = true, optional = true }
wasmtime-wasi = { workspace = true, optional = true }
# Only for `test_server`, which only exists under `test-support`. See the
# `[dev-dependencies]` entry below for why it is rustls with `ring`.
rustls = { version = "0.23", default-features = false, features = [
    "ring",
    "std",
    "tls12",
    "logging",
], optional = true }

# The system's UTC offset, for `services::Locale`. See the workspace manifest.
[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

# The key behind the `secrets` store, held by the OS — see `keyring`.
[target.'cfg(windows)'.dependencies]
windows-sys.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3"

[dev-dependencies]
# A TLS server the transport tests point at. `default-features = false` with
# `ring` because the default provider is `aws-lc-rs`, which needs cmake — and a
# test nobody can build on a plain machine is a test nobody runs.
#
# PEM is parsed through `rustls::pki_types`, which rustls re-exports, rather
# than through `rustls-pemfile`: that crate has been a thin wrapper over exactly
# this since pki-types 1.9 and is now unmaintained (RUSTSEC-2025-0134).
# `cargo deny` is what said so, which is what it is there for.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }

[features]
default = ["wasmtime"]
wasmtime = ["dep:wasmtime", "dep:wasmtime-wasi"]
# The TLS server in `test_server`, for other crates' tests. A dev-dependency
# elsewhere in the workspace, so a release build never turns it on and the
# module is not compiled into anything that ships.
test-support = ["dep:rustls"]
