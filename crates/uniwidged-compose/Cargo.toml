[package]
name = "uniwidged-compose"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
authors.workspace = true
description = "Turns a uniwidged view tree into a Vello scene, hit rects and accessibility nodes."

[dependencies]
uniwidged-core.workspace = true
uniwidged-view.workspace = true
uniwidged-render.workspace = true
# The box model, in `layout::boxes`. Taffy directly rather than through a
# wrapper crate: the vocabulary a widget can describe is small enough that the
# facade is two hundred lines, and this workspace depends on nothing outside
# crates.io — see NOTICE.md on what was adopted and from where.
taffy.workspace = true
# Text is Parley directly. A generic wrapper exposes size and family, and this
# crate needs weight (a title at 600 against a body at 400 is most of the
# hierarchy) and tabular figures (a clock whose digits change width jitters
# once a second).
parley.workspace = true
accesskit.workspace = true

[dev-dependencies]
# The golden-image suite renders for real and decodes the references itself.
uniwidged-render.workspace = true
png.workspace = true
