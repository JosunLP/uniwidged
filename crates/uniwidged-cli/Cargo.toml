[package]
name = "uniwidged-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "The uniwidged command-line tool."

[[bin]]
name = "uniwidged"
path = "src/main.rs"

[dependencies]
uniwidged-core.workspace = true
uniwidged-compose.workspace = true
uniwidged-host.workspace = true
uniwidged-render.workspace = true
uniwidged-runtime.workspace = true
uniwidged-shell.workspace = true

[dev-dependencies]
# The scaffold test instantiates what `uniwidged new` produced, so it needs the
# view vocabulary to read the widget's answer back.
uniwidged-view.workspace = true
