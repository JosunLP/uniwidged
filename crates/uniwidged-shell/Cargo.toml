[package]
name = "uniwidged-shell"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
authors.workspace = true
description = "Desktop-layer surfaces: below every window, above the wallpaper, on four platforms."

[features]
# Test support, and nothing a release build can reach. It exposes
# `WaylandWindow::present_blank`, which attaches a shared-memory buffer so that
# a surface is *mapped* — the precondition for a compositor delivering a
# pointer event to it, and something a widget never needs because its pixels
# come from wgpu. Turned on by a `[dev-dependencies]` line and by nothing else,
# exactly as `uniwidged-runtime`'s `test-support` is.
test-support = []

[dependencies]
uniwidged-core.workspace = true
raw-window-handle.workspace = true

[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
x11rb.workspace = true
# The system libwayland, not the pure-Rust backend: Mesa's Vulkan WSI drives the
# same `wl_display`, and the two have to be holding the same C object. A Rust
# connection has no pointer to give wgpu.
#
# `dlopen` rather than linking: libwayland is loaded at runtime if it is there.
# That is what lets one binary run on an X11-only machine with no libwayland
# installed at all — which is most servers, and every container anybody builds
# this in. It also means the build needs no `-dev` package.
wayland-client = { version = "0.31", features = ["dlopen"] }
wayland-backend = { version = "0.3", features = ["client_system", "dlopen"] }
wayland-protocols = { version = "0.32", features = ["client"] }
wayland-protocols-wlr = { version = "0.3", features = ["client"] }

[target.'cfg(unix)'.dependencies]
# `pipe`, `read`, `write` and `poll` for the wake pipe — see `wake`.
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
objc2.workspace = true
block2.workspace = true
objc2-foundation = { workspace = true, features = [
    "NSArray",
    "NSDate",
    "NSGeometry",
    "NSNotification",
    "NSObjCRuntime",
    "NSOperation",
    "NSRunLoop",
    "NSString",
    "block2",
] }
objc2-app-kit = { workspace = true, features = [
    "NSApplication",
    "NSColor",
    "NSEvent",
    "NSGraphics",
    "NSPanel",
    "NSResponder",
    "NSRunningApplication",
    "NSScreen",
    "NSView",
    "NSVisualEffectView",
    "NSWindow",
    "objc2-quartz-core",
] }
objc2-quartz-core = { workspace = true, features = ["CALayer", "CAMetalLayer", "objc2-core-foundation"] }

[dev-dependencies]
# What turns the feature above on for tests, and only for tests.
uniwidged-shell = { path = ".", features = ["test-support"] }
# The drag test drives the same interaction model the desktop does, rather than
# a copy of it — a measurement of a reimplementation measures the
# reimplementation.
uniwidged-host.workspace = true
# The Windows and macOS suites put a real swapchain on a widget window and read
# back what it can blend — the one way to measure "the wallpaper shows through
# its glass" rather than assert it.
uniwidged-render.workspace = true

[target.'cfg(all(unix, not(target_os = "macos")))'.dev-dependencies]
# `tests/wayland_input.rs` creates a `zwlr_virtual_pointer_v1` — a mouse that
# does not exist — because headless sway has no input device and there is
# otherwise nothing to move. Test-only: nothing that ships synthesises input,
# on either platform.
wayland-client = { version = "0.31", features = ["dlopen"] }
wayland-protocols-wlr = { version = "0.3", features = ["client"] }
# `xtest` fakes pointer input, which is the only way to measure a drag rather
# than assert one. Test-only: nothing that ships synthesises input.
x11rb = { workspace = true, features = ["xtest"] }

# AppKit is driven from the main thread, and libtest gives every test a thread
# of its own — so this suite is a plain `main`. It does nothing off macOS.
[[test]]
name = "appkit_desktop"
harness = false
